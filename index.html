<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0a08">
<title>جوال موظف ڤاليلا ضايع</title>
<meta name="description" content="هذا الجوال ضايع. إذا لقيته لا تفتح الواتساب ولا الملفات.">
<meta property="og:type" content="website">
<meta property="og:title" content="جوال موظف ڤاليلا ضايع 📵">
<meta property="og:description" content="إذا لقيته… لا تفتح الواتساب ولا الملفات.">
<meta property="og:url" content="https://y-la.github.io/valila-lost-phone/">
<meta property="og:image" content="https://y-la.github.io/valila-lost-phone/assets/img/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="جوال موظف ڤاليلا ضايع 📵">
<meta name="twitter:description" content="إذا لقيته… لا تفتح الواتساب ولا الملفات.">
<meta name="twitter:image" content="https://y-la.github.io/valila-lost-phone/assets/img/share.jpg">
<link rel="icon" href="assets/img/valila_mark_yellow.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage">
  <div class="device" id="device">
    <div class="screen" id="screen">
      <div class="wallpaper"></div>

      <!-- status bar -->
      <div class="statusbar" id="statusbar">
        <span class="sb-time" data-clock></span>
        <span class="island"></span>
        <span class="sb-icons">
          <svg viewBox="0 0 18 12" class="sig"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
          <svg viewBox="0 0 16 12" class="wifi"><path d="M8 11.5l2.2-2.6a3.2 3.2 0 0 0-4.4 0zM3.4 6.4l1.4 1.6a4.8 4.8 0 0 1 6.4 0l1.4-1.6a7 7 0 0 0-9.2 0zM.6 3.3L2 4.9a9.1 9.1 0 0 1 12 0l1.4-1.6a11.3 11.3 0 0 0-14.8 0z"/></svg>
          <span class="batt"><span class="batt-num">٩</span><span class="batt-body"><span class="batt-fill"></span></span></span>
        </span>
      </div>

      <!-- lock screen -->
      <section class="lock" id="lock">
        <div class="lock-top">
          <div class="lock-date" id="lockDate"></div>
          <div class="lock-clock" data-clock-big></div>
        </div>
        <div class="lost-card">
          <div class="lost-title">هذا الجوال ضايع</div>
          <div class="lost-text">إذا لقيته رجّعه لمكتب ڤاليلا<br>ولا تفتح الواتساب ولا الملفات 🙏</div>
          <div class="lost-sign">يوسف · فريق التسويق</div>
        </div>
        <div class="notifs" id="lockNotifs"></div>
        <div class="lock-bottom">
          <button class="lock-btn" aria-label="الكشاف"><svg viewBox="0 0 24 24"><path d="M8 2h8v4l-2 3v12a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V9L8 6z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
          <div class="swipe-hint" id="swipeHint">اسحب لفوق للفتح</div>
          <button class="lock-btn" aria-label="الكاميرا"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        </div>
      </section>

      <!-- home screen -->
      <section class="home" id="home" aria-hidden="true">
        <div class="home-grid" id="homeGrid"></div>
        <div class="search-pill"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>بحث</div>
        <div class="dock" id="dock"></div>
      </section>

      <!-- app window -->
      <section class="appwin" id="appwin" aria-hidden="true"></section>

      <div class="toast" id="toast"></div>
      <div class="viewer" id="viewer"></div>
      <div class="home-indicator" id="homeIndicator" title="الرئيسية"></div>
    </div>
  </div>
  <p class="stage-note">جوال ضايع… لقيته؟ <span>لا تفتح الواتساب</span></p>
</main>
<script src="app.js"></script>
</body>
</html>
